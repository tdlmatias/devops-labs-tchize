---
# Task list: stop the frontend application services before a reboot.
#
# Included by reboot_Application.yml for hosts in the "frontend" group via
# `include_tasks`. Services are driven by the `frontend_services` variable
# (see group_vars/all.yml); it defaults to an empty list, so on a bare lab
# this runs as a harmless no-op until you list your real services.
- name: Stop frontend application services
  ansible.builtin.service:
    name: "{{ item }}"
    state: stopped
  loop: "{{ frontend_services }}"
  loop_control:
    label: "{{ item }}"
