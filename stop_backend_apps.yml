---
# Task list: stop the backend application services before a reboot.
#
# Included by reboot_Application.yml for hosts in the "backend" group via
# `include_tasks`. Driven by the `backend_services` variable (see
# group_vars/all.yml); defaults to an empty list, so it is a no-op until you
# list your real services.
- name: Stop backend application services
  ansible.builtin.service:
    name: "{{ item }}"
    state: stopped
  loop: "{{ backend_services }}"
  loop_control:
    label: "{{ item }}"
