name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: qbittorrent-plugin-sync
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            quality: true
          - python-version: "3.12"
            quality: false
          - python-version: "3.13"
            quality: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            qbittorrent-plugin-sync/requirements.txt
            qbittorrent-plugin-sync/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q qbt_plugin_sync.py qbt_sync tests

      - name: Lint with Ruff
        if: matrix.quality
        run: python -m ruff check qbt_plugin_sync.py qbt_sync tests

      - name: Run tests with coverage
        if: matrix.quality
        run: >-
          python -m pytest -v
          --cov=qbt_sync
          --cov-report=term-missing

      - name: Run tests
        if: ${{ !matrix.quality }}
        run: python -m pytest -v

      - name: Write job summary
        if: always()
        run: |
          {
            echo "### Python ${{ matrix.python-version }}"
            echo
            echo "- Compilation, offline tests, and dependency installation were requested."
            echo "- Ruff and coverage run on Python 3.11 only."
            echo "- No qBittorrent service, credentials, or repository secrets were used."
          } >> "$GITHUB_STEP_SUMMARY"
