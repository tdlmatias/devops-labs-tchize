name: Security

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: qbittorrent-plugin-sync
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            qbittorrent-plugin-sync/requirements.txt
            qbittorrent-plugin-sync/requirements-dev.txt

      - name: Install audit tool
        run: python -m pip install -r requirements-dev.txt

      - name: Audit runtime dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Write job summary
        if: always()
        run: |
          {
            echo "### Python dependency audit"
            echo
            echo "Audited the dependencies resolved from \`requirements.txt\`."
            echo "No application code or qBittorrent integration was executed."
          } >> "$GITHUB_STEP_SUMMARY"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
