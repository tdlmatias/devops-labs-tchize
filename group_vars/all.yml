---
userBox: vagrant
env1: ansible_tower
env2: deploy_env1
env3: deploy_env2

# Derive the path to the Vagrant project (this repo) from the location of the
# playbook that loads these vars, instead of hardcoding an absolute,
# user-specific path. Override with `-e homepath=/path/to/project` if the
# playbooks are run from elsewhere.
homepath: "{{ playbook_dir }}"
pvKeys1: "{{ homepath }}/.vagrant/machines/{{ env1 }}/virtualbox/private_key"
pvKeys2: "{{ homepath }}/.vagrant/machines/{{ env2 }}/virtualbox/private_key"
pvKeys3: "{{ homepath }}/.vagrant/machines/{{ env3 }}/virtualbox/private_key"

# Application services managed by reboot_Application.yml. Populate these with
# the systemd/init service names running on your frontend and backend hosts.
# They default to empty lists so the reboot workflow runs as a no-op on a bare
# lab (nothing to stop/start) until you have real services to manage.
frontend_services: []
backend_services: []
